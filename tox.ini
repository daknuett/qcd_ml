[tox]
envlist = py312
#,py313
isolated_build = True
toxworkdir=/tmp/.tox

[testenv]
wheel = true
setenv = 
    OMP_NUM_THREADS=8
    OMP_PROC_BIND=spread
    OMP_PLACES=cores
deps = 
    pytest
    pytest-benchmark
    pytest-benchmark[histogram]
commands = 
        pytest -v {posargs} test/
        

[testenv:docs]
basepython = python3.12
allowlist_externals = make
deps = 
    sphinx

commands =
        make -C docs/ html


[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase


[testenv:coverage]
package = editable
setenv = 
    OMP_NUM_THREADS=8
    OMP_PROC_BIND=spread
    OMP_PLACES=cores
deps = 
    pytest
    pytest-benchmark
    pytest-benchmark[histogram]
    pytest-cov
commands = 
        pytest --cov=src/qcd_ml --cov-append --cov-report=html --runslow -v {posargs} test/
